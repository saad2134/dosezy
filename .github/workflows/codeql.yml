name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 13 * * 3"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  # ------------------------------------------------------------
  # Change Detection
  # ------------------------------------------------------------
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      website: ${{ steps.filter.outputs.website }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'patient/android/**'
              - '.github/workflows/codeql.yml'
            website:
              - 'website/**'
              - '.github/workflows/codeql.yml'
            server:
              - 'server/**'
              - '.github/workflows/codeql.yml'

  # ------------------------------------------------------------
  # Android / Kotlin / Java
  # ------------------------------------------------------------
  analyze-android:
    name: Analyze (java-kotlin)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Inspect Android project
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
       
          echo "=== Gradle projects ==="
          ./gradlew projects --no-daemon
       
          echo "=== Available assemble tasks ==="
          ./gradlew tasks --all --no-daemon | grep -i assemble || true
       
          echo "=== Android directory ==="
          find . -maxdepth 3 -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            | sort

      - name: Build Android
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean assemble --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"


  # ------------------------------------------------------------
  # Website / JavaScript / TypeScript
  # ------------------------------------------------------------
  analyze-website:
    name: Analyze (javascript-typescript)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"


  # ------------------------------------------------------------
  # Server / Python
  # ------------------------------------------------------------
  analyze-server:
    name: Analyze (python)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
