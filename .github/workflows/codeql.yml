name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 13 * * 3"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  # ------------------------------------------------------------
  # Android / Kotlin / Java
  # ------------------------------------------------------------
  analyze-android:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          paths: |
            patient/android

      - name: Inspect Android project
        if: matrix.language == 'java-kotlin'
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      
          echo "=== Gradle projects ==="
          ./gradlew projects --no-daemon
      
          echo "=== Available assemble tasks ==="
          ./gradlew tasks --all --no-daemon | grep -i assemble || true
      
          echo "=== Android directory ==="
          find . -maxdepth 3 -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            | sort

      - name: Build Android
        if: matrix.language == 'java-kotlin'
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean assemble --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"


  # ------------------------------------------------------------
  # Website / JavaScript / TypeScript
  # ------------------------------------------------------------
  analyze-website:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          paths: |
            website

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"


  # ------------------------------------------------------------
  # Server / Python
  # ------------------------------------------------------------
  analyze-server:
    name: Analyze (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          paths: |
            server

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
