name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 13 * * 3"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  # ------------------------------------------------------------
  # Change Detection
  # ------------------------------------------------------------
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patient_android: ${{ steps.filter.outputs.patient_android }}
      website: ${{ steps.filter.outputs.website }}
      server: ${{ steps.filter.outputs.server }}
      caregiver_web: ${{ steps.filter.outputs.caregiver_web }}
      patient_ios: ${{ steps.filter.outputs.patient_ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            patient_android:
              - 'patient/android/**'
              - '.github/workflows/codeql.yml'
            website:
              - 'website/**'
              - '.github/workflows/codeql.yml'
            server:
              - 'server/**'
              - '.github/workflows/codeql.yml'
            caregiver_web:
              - 'caregiver/web/**'
              - '.github/workflows/codeql.yml'
            patient_ios:
              - 'patient/ios/**'
              - '.github/workflows/codeql.yml'

  # ------------------------------------------------------------
  # Patient Android / Kotlin / Java
  # ------------------------------------------------------------
  analyze-patient-android:
    name: Analyze Patient Android (java-kotlin)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.patient_android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Inspect Android project
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
       
          echo "=== Gradle projects ==="
          ./gradlew projects --no-daemon
       
          echo "=== Available assemble tasks ==="
          ./gradlew tasks --all --no-daemon | grep -i assemble || true
       
          echo "=== Android directory ==="
          find . -maxdepth 3 -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            | sort

      - name: Build Android
        working-directory: patient/android
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean assemble --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"


  # ------------------------------------------------------------
  # Website / JavaScript / TypeScript
  # ------------------------------------------------------------
  analyze-website:
    name: Analyze Website (javascript-typescript)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - website

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript/website"


  # ------------------------------------------------------------
  # Caregiver Web / JavaScript / TypeScript
  # ------------------------------------------------------------
  analyze-caregiver-web:
    name: Analyze Caregiver Web (javascript-typescript)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.caregiver_web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source files
        id: check-files
        shell: bash
        run: |
          if [ ! -d "caregiver/web" ] || [ -z "$(find caregiver/web -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.vue' -o -name '*.html' -o -name '*.htm' \) 2>/dev/null)" ]; then
            echo "::notice::Directory 'caregiver/web' is missing or contains no JavaScript/TypeScript source files. Skipping CodeQL scan."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - caregiver/web

      - name: Perform CodeQL Analysis
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript/caregiver-web"


  # ------------------------------------------------------------
  # Patient iOS / Swift
  # ------------------------------------------------------------
  analyze-patient-ios:
    name: Analyze Patient iOS (swift)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.patient_ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source files
        id: check-files
        shell: bash
        run: |
          if [ ! -d "patient/ios" ] || [ -z "$(find patient/ios -type f \( -name '*.swift' -o -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Package.swift' \) 2>/dev/null)" ]; then
            echo "::notice::Directory 'patient/ios' is missing or contains no Swift source files. Skipping CodeQL scan."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: autobuild
          config: |
            paths:
              - patient/ios

      - name: Perform CodeQL Analysis
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"


  # ------------------------------------------------------------
  # Server / TypeScript / JavaScript (Node.js & Fastify)
  # ------------------------------------------------------------
  analyze-server:
    name: Analyze Server (javascript-typescript)
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source files
        id: check-files
        shell: bash
        run: |
          if [ ! -d "server" ] || [ -z "$(find server -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' \) 2>/dev/null)" ]; then
            echo "::notice::Directory 'server' is missing or contains no JavaScript/TypeScript source files. Skipping CodeQL scan."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - server

      - name: Perform CodeQL Analysis
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript/server"
