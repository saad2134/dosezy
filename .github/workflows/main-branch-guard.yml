name: "Main Branch Source Guard"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-source:
    name: "Verify Source Branch is develop"
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR head branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Actor: ${{ github.actor }}"
          if [ "${{ github.head_ref }}" = "develop" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "PR source verified successfully."
          else
            case "${{ github.head_ref }}" in
              dependabot/*)
                echo "Dependabot automated branch verified successfully."
                ;;
              *)
                echo "::error title=Invalid Target Branch::Pull requests targeting 'main' must originate from 'develop' (or dependabot). Current head branch is '${{ github.head_ref }}'. Please retarget this pull request to 'develop'."
                exit 1
                ;;
            esac
          fi

      - name: Verify No Open PRs Target develop
        if: github.head_ref == 'develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying that no open pull requests are pointed at 'develop'..."
          OPEN_PRS=$(gh pr list --repo "$REPO" --base develop --state open --json number,title,headRefName --jq '.[] | "PR #\(.number) [\(.headRefName)]: \(.title)"')
          if [ -n "$OPEN_PRS" ]; then
            echo "::error title=Active PRs Target develop::Cannot merge develop into main while open pull requests are targeting develop. All develop-bound PRs must be merged or closed first."
            echo "Pending pull requests targeting develop:"
            echo "$OPEN_PRS"
            exit 1
          fi
          echo "Verified: Zero open pull requests targeting develop."
