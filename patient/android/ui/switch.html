<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dozesy App</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
      --primary-50: #eef7fe;
      --primary-100: #dbeffd;
      --primary-200: #c1e3fc;
      --primary-300: #9ad2fa;
      --primary-400: #6cbaf7;
      --primary-500: #48a1f2;
      --primary-600: #2e83d9;
      --primary-700: #2569b2;
      --primary-800: #21568e;
      --primary-900: #204871;
      --primary-950: #162f4b;
      --secondary-50: #f0f9ff;
      --secondary-100: #e0f2fe;
      --secondary-200: #bae6fd;
      --secondary-300: #7dd3fc;
      --secondary-400: #38bdf8;
      --secondary-500: #0ea5e9;
      --secondary-600: #0284c7;
      --secondary-700: #0369a1;
      --secondary-800: #075985;
      --secondary-900: #0c4a6e;
      --secondary-950: #082f49;
    }
    body {
      font-family: 'Lexend', sans-serif;
    }
    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .option-row {
            cursor: pointer;
        }

        .option-row input {
            pointer-events: none;
        }

        /* prevent tiny click-only */
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen flex-col ">


        <header class="bg-white p-4 shadow-sm sticky top-0 z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img alt="User profile picture" class="h-12 w-12 rounded-2xl object-cover"
                        src="https://images.ctfassets.net/h6goo9gw1hh6/2sNZtFAWOdP1lmQ33VwRN3/24e953b920a9cd0ff2e1d587742a2472/1-intro-photo-final.jpg?w=1200&h=992&fl=progressive&q=70&fm=jpg" />
                    <div>
                        <p class="text-2xl font-bold text-gray-800">Hi, John!</p>
                        <p class="text-sm text-gray-500">"Health is a priceless wealth."</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button aria-label="Notifications Status: All good" id="notifBtn"
                        class="relative flex items-center justify-center rounded-xl h-12 w-12 bg-green-500 text-white">
                        <span class="material-symbols-outlined text-3xl "> notifications </span>
                        <span
                            class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-white text-green-500">
                            <span class="material-symbols-outlined text-sm"> check </span>
                        </span>

                </div>
            </div>


            <header class="flex items-center justify-between mt-8 mb-2">
                <a href="menu.html"
                    class="flex items-center justify-center rounded-full p-2 text-[#0D1B1B] hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#11D4D4]">
                    <span class="material-symbols-outlined text-3xl">arrow_back</span>
                </a>
                <h1 class="flex-1 text-center text-3xl font-bold text-[#0D1B1B]">Switch Profile</h1>
                <div class="w-8"></div>
            </header>


        </header>




        <main class="flex flex-col gap-2 px-4 pt-4 pb-28">


            <!-- Profiles List -->
            <div class="space-y-4">
                <!-- Profile 1 -->
                <a href="index.html"
                    class="flex items-center justify-between p-4 bg-blue-100 rounded-xl hover:bg-gray-200 transition-colors">
                    <div class="flex items-center gap-3">
                        <img alt="User profile picture" class="h-12 w-12 rounded-2xl object-cover"
                            src="https://images.ctfassets.net/h6goo9gw1hh6/2sNZtFAWOdP1lmQ33VwRN3/24e953b920a9cd0ff2e1d587742a2472/1-intro-photo-final.jpg?w=1200&h=992&fl=progressive&q=70&fm=jpg" />
                        <p class="text-lg font-medium text-gray-800">John Doe</p>
                    </div>
                    <span class="material-symbols-outlined text-gray-400 text-2xl">chevron_right</span>
                </a>

                <!-- Profile 2 -->
                <a href="#"
                    class="flex items-center justify-between p-4 bg-blue-100 rounded-xl hover:bg-gray-200 transition-colors">
                    <div class="flex items-center gap-3">
                        <img alt="User profile picture" class="h-12 w-12 rounded-2xl object-cover"
                            src="https://avatarfiles.alphacoders.com/360/360040.jpg" />
                        <p class="text-lg font-medium text-gray-800">Whoever</p>
                    </div>
                    <span class="material-symbols-outlined text-gray-400 text-2xl">chevron_right</span>
                </a>
            </div>

            <!-- Add New Profile Button -->
            <a href="new_1.html"
                class="mt-6 w-full flex items-center justify-center gap-2 rounded-xl h-14 px-6 bg-blue-500 text-white text-lg font-bold hover:bg-blue-600 transition-colors duration-300">
                <span class="material-symbols-outlined text-xl">person_add</span>
                <span>New Profile</span>
            </a>

        </main>


        <div class="fixed bottom-0 left-0 right-0 z-20">
            <nav class="flex justify-around items-center border-t border-gray-200 bg-white py-2">
                <!-- Home -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="home.html">
                    <span class="material-symbols-outlined text-3xl">home</span>
                    <p class="text-xs font-medium">Home</p>
                </a>

                <!-- Schedule -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="schedule.html">
                    <span class="material-symbols-outlined text-3xl">calendar_month</span>
                    <p class="text-xs font-medium">Schedule</p>
                </a>

                <!-- Center Add Button -->
                <a href="add_med.html" aria-label="Add New Medicine"
                    class="flex items-center justify-center w-14 h-14 bg-blue-500 rounded-2xl text-white shadow-lg transform transition-transform hover:scale-105 active:scale-95">
                    <span class="material-symbols-outlined text-4xl">add</span>
                </a>

                <!-- Medicines -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="medicines.html">
                    <span class="material-symbols-outlined text-3xl">medication</span>
                    <p class="text-xs font-medium">Medicines</p>
                </a>

                <!-- Menu -->
                <a class="flex flex-col items-center gap-1  text-blue-500" href="menu.html">
                    <span class="material-symbols-outlined text-3xl">menu</span>
                    <p class="text-xs font-medium">Menu</p>
                </a>
            </nav>
        </div>
    </div>




</body>

</html>
