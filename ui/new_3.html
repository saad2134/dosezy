<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <style type="text/tailwindcss">
        :root {
      --primary-50: #eef7fe;
      --primary-100: #dbeffd;
      --primary-200: #c1e3fc;
      --primary-300: #9ad2fa;
      --primary-400: #6cbaf7;
      --primary-500: #48a1f2;
      --primary-600: #2e83d9;
      --primary-700: #2569b2;
      --primary-800: #21568e;
      --primary-900: #204871;
      --primary-950: #162f4b;
      --secondary-50: #f0f9ff;
      --secondary-100: #e0f2fe;
      --secondary-200: #bae6fd;
      --secondary-300: #7dd3fc;
      --secondary-400: #38bdf8;
      --secondary-500: #0ea5e9;
      --secondary-600: #0284c7;
      --secondary-700: #0369a1;
      --secondary-800: #075985;
      --secondary-900: #0c4a6e;
      --secondary-950: #082f49;
    }
    body {
      font-family: 'Lexend', sans-serif;
    }
    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .option-row {
            cursor: pointer;
        }

        .option-row input {
            pointer-events: none;
        }

        /* prevent tiny click-only */
    </style>

    <style type="text/tailwindcss">
        :root {
        --primary-color: #2084e4;
        --secondary-color: #e7eff3;
        --text-primary: #0d171b;
        --text-secondary: #4c809a;
        --background-color: #f8fafc;
      }
      .form-input {
        @apply flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d171b] focus:outline-0 focus:ring-2 focus:ring-[#1193d4] border-2 border-slate-200 bg-white h-16 placeholder:text-slate-400 p-4 text-lg font-normal leading-normal;
      }
      .form-label {
        @apply text-[var(--text-primary)] text-lg font-medium leading-normal pb-2;
      }
    </style>

</head>

<div class="relative flex min-h-screen w-full flex-col justify-between bg-slate-50"
    style='font-family: Lexend, "Noto Sans", sans-serif;'>
    <main class="flex-grow px-4 pt-12 pb-8">
        <div class="mx-auto max-w-md">

            <div class="flex w-full flex-row items-center justify-center gap-3 mb-6">
                <div class="h-2.5 w-2.5 rounded-full bg-slate-300"></div>
                <div class="h-2.5 w-2.5 rounded-full bg-slate-300"></div>
                <div class="h-2.5 w-8 rounded-full bg-[var(--primary-500)]"></div>
            </div>

            <h1 class="text-center text-3xl font-bold text-[var(--text-primary)]">Tell us about yourself</h1>
            <p class="mt-2 text-center text-base text-[var(--text-secondary)]">This helps us personalize your
                experience.</p>
            <div class="mt-8 flex justify-center">
                <div class="relative">
                    <img alt="Profile picture placeholder" class="h-32 w-32 rounded-full object-cover"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAag0s_VaM9-4hiDlo_krgNJeCFkN5fA7i2IB9e1JeGDbWX_Hm4rbH727lDULb-fVUqoAxdi7FIvkBEOXALk34yT6J2mZ7pMszAyz7PzRgChXexL4RGh5zWVOmK11ngS2ZhjAo1yRkhhmizFPq3a4hlioeTzZGJoSr2gmMfO1goW_aMMdcugzNmbekJaoz9xtmp0gwCyoH7eagZrdrC6Dh1iGKdxCv0nR5LN5cBK6ANn5hcEyMv2FoJt_w66Skuq25J1qsvnwYCkFc" />
                    <button
                        class="absolute bottom-0 right-0 flex h-10 w-10 items-center justify-center rounded-full bg-[var(--primary-color)] text-white shadow-md transition-transform hover:scale-110">
                        <span class="material-symbols-outlined"> edit </span>
                        <input class="absolute h-full w-full cursor-pointer opacity-0" type="file" />
                    </button>
                </div>
            </div>
            <form class="mt-8 space-y-6">
                <div>
                    <label class="block text-base font-medium text-[var(--text-primary)]" for="name">Name</label>
                    <div class="mt-2">
                        <input
                            class="form-input flex w-full rounded-xl border-none p-4 text-base text-[var(--text-primary)] placeholder:[var(--text-secondary)] focus:ring-0"
                            id="name" name="name" placeholder="Enter your name" type="text" />
                    </div>
                </div>
                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label class="block text-base font-medium text-[var(--text-primary)]" for="age">Age</label>
                        <div class="mt-2">
                            <input
                                class="form-input flex w-full rounded-xl border-none p-4 text-base text-[var(--text-primary)] placeholder:[var(--text-secondary)] focus:ring-0"
                                id="age" name="age" placeholder="Your age" type="number" />
                        </div>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-base font-medium text-[var(--text-primary)]"
                            for="gender">Gender</label>
                        <div class="mt-2">
                            <select
                                class="form-input form-select flex w-full appearance-none rounded-xl border-none bg-right p-4 text-base text-[var(--text-primary)] placeholder:[var(--text-secondary)] focus:ring-0"
                                id="gender" name="gender">
                                <option class="text-[var(--text-secondary)]">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-base font-medium text-[var(--text-primary)]" for="contact">Contact
                        Number</label>
                    <div class="mt-2">
                        <input
                            class="form-input flex w-full rounded-xl border-none p-4 text-base text-[var(--text-primary)] placeholder:[var(--text-secondary)] focus:ring-0"
                            id="contact" name="contact" placeholder="Enter your contact number" type="tel" />
                    </div>
                </div>
            </form>
        </div>
    </main>
    <div class="sticky bottom-2 w-full bg-slate-50 py-4 px-6">
        <div class="flex gap-4">
            <a href="new_2.html"
                class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-slate-200 text-slate-800 text-lg font-bold leading-normal">
                Back
            </a>

            <a href="index.html"
                class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-[#2084e4] text-white text-lg font-bold leading-normal">
                Submit
            </a>

        </div>
    </div>
</div>

</body>

</html>
