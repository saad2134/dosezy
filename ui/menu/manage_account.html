<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dozesy App</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
      --primary-50: #eef7fe;
      --primary-100: #dbeffd;
      --primary-200: #c1e3fc;
      --primary-300: #9ad2fa;
      --primary-400: #6cbaf7;
      --primary-500: #48a1f2;
      --primary-600: #2e83d9;
      --primary-700: #2569b2;
      --primary-800: #21568e;
      --primary-900: #204871;
      --primary-950: #162f4b;
      --secondary-50: #f0f9ff;
      --secondary-100: #e0f2fe;
      --secondary-200: #bae6fd;
      --secondary-300: #7dd3fc;
      --secondary-400: #38bdf8;
      --secondary-500: #0ea5e9;
      --secondary-600: #0284c7;
      --secondary-700: #0369a1;
      --secondary-800: #075985;
      --secondary-900: #0c4a6e;
      --secondary-950: #082f49;
    }
    body {
      font-family: 'Lexend', sans-serif;
    }
    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .option-row {
            cursor: pointer;
        }

        .option-row input {
            pointer-events: none;
        }

        /* prevent tiny click-only */
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen flex-col ">


        <header class="bg-white p-4 shadow-sm sticky top-0 z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img alt="User profile picture" class="h-12 w-12 rounded-2xl object-cover"
                        src="https://images.ctfassets.net/h6goo9gw1hh6/2sNZtFAWOdP1lmQ33VwRN3/24e953b920a9cd0ff2e1d587742a2472/1-intro-photo-final.jpg?w=1200&h=992&fl=progressive&q=70&fm=jpg" />
                    <div>
                        <p class="text-2xl font-bold text-gray-800">Hi, John!</p>
                        <p class="text-sm text-gray-500">"Health is a priceless wealth."</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button aria-label="Notifications Status: All good"
                        class="relative flex items-center justify-center rounded-xl h-10 w-10 bg-green-500 text-white">
                        <span class="material-symbols-outlined text-xl "> notifications </span>
                        <span
                            class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-white text-green-500">
                            <span class="material-symbols-outlined text-sm"> check </span>
                        </span>

                </div>
            </div>


            <header class="flex items-center justify-between mt-8 mb-2">
                <a href="../menu.html"
                    class="flex items-center justify-center rounded-full p-2 text-[#0D1B1B] hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#11D4D4]">
                    <span class="material-symbols-outlined text-3xl">arrow_back</span>
                </a>
                <h1 class="flex-1 text-center text-3xl font-bold text-[#0D1B1B]">Manage Profile</h1>
                <div class="w-8"></div>
            </header>


        </header>




        <main class="flex flex-col gap-6 px-4 pt-4 pb-28">
            <div class="flex flex-col gap-2">
                <label class="text-[#0d171b] text-lg font-medium leading-normal" for="name">Name</label>
                <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d171b] focus:outline-0 focus:ring-2 focus:ring-[#1193d4] border-2 border-slate-200 bg-white h-16 placeholder:text-slate-400 p-4 text-lg font-normal leading-normal"
                    id="name" value="Eleanor Vance" />
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[#0d171b] text-lg font-medium leading-normal" for="age">Age</label>
                <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d171b] focus:outline-0 focus:ring-2 focus:ring-[#1193d4] border-2 border-slate-200 bg-white h-16 placeholder:text-slate-400 p-4 text-lg font-normal leading-normal"
                    id="age" type="number" value="72" />
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[#0d171b] text-lg font-medium leading-normal" for="gender">Gender (Optional)</label>
                <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d171b] focus:outline-0 focus:ring-2 focus:ring-[#1193d4] border-2 border-slate-200 bg-white h-16 placeholder:text-slate-400 p-4 text-lg font-normal leading-normal"
                    id="gender" placeholder="e.g. Female" />
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[#0d171b] text-lg font-medium leading-normal" for="contact">Contact
                    Information</label>
                <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d171b] focus:outline-0 focus:ring-2 focus:ring-[#1193d4] border-2 border-slate-200 bg-white h-16 placeholder:text-slate-400 p-4 text-lg font-normal leading-normal"
                    id="contact" type="tel" value="(123) 456-7890" />
            </div>



            <div class="pt-8">
                <a href="../menu.html"
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-2xl h-16 px-5 bg-blue-500 text-white text-xl font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Save Changes</span>
                </a>
            </div>

            <div class="flex justify-center">
                <a href="../menu.html"
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-2xl h-16 px-5 bg-red-100 text-red-500 text-lg font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Delete Profile</span>
                </a>
            </div>
            
        </main>


        <div class="fixed bottom-0 left-0 right-0 z-20">
            <nav class="flex justify-around items-center border-t border-gray-200 bg-white py-2">
                <!-- Home -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="../home.html">
                    <span class="material-symbols-outlined text-3xl">home</span>
                    <p class="text-xs font-medium">Home</p>
                </a>

                <!-- Schedule -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="../schedule.html">
                    <span class="material-symbols-outlined text-3xl">calendar_month</span>
                    <p class="text-xs font-medium">Schedule</p>
                </a>

                <!-- Center Add Button -->
                <button aria-label="Add New Medicine"
                    class="flex items-center justify-center w-14 h-14 bg-blue-500 rounded-2xl text-white shadow-lg transform transition-transform hover:scale-105 active:scale-95">
                    <span class="material-symbols-outlined text-4xl">add</span>
                </button>

                <!-- Medicines -->
                <a class="flex flex-col items-center gap-1 text-gray-400" href="../medicines.html">
                    <span class="material-symbols-outlined text-3xl">medication</span>
                    <p class="text-xs font-medium">Medicines</p>
                </a>

                <!-- Menu -->
                <a class="flex flex-col items-center gap-1  text-blue-500" href="../menu.html">
                    <span class="material-symbols-outlined text-3xl">menu</span>
                    <p class="text-xs font-medium">Menu</p>
                </a>
            </nav>
        </div>
    </div>




</body>

</html>
